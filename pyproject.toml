[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-personal-finance"
version = "0.1.0"
description = "Swiss personal finance planning tool with 2. Säule and 3a calculations"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Finance Tools", email = "admin@example.com"}
]
license = {text = "MIT"}
keywords = ["finance", "swiss", "retirement", "dashboard", "pillar2", "pillar3a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "dash>=2.14.0",
    "plotly>=5.17.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
]

[tool.setuptools]
packages = ["personal_finance"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[project.scripts]
swiss-finance-dashboard = "personal_finance.dashboard:run_dashboard"
swiss-finance-dashboard-pro = "personal_finance.dashboard_enhanced:run_dashboard"
