[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-personal-finance"
version = "1.0.0"
description = "Swiss personal finance planning tool with 2. Säule and 3a calculations"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Nick Hostettler"}
]
# Proprietary: published for viewing only, all rights reserved (see LICENSE).
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["finance", "swiss", "retirement", "dashboard", "pillar2", "pillar3a"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "dash>=2.14.0",
    "gunicorn>=23.0 ; sys_platform != 'win32'",
    "plotly>=5.17.0",
]

[project.scripts]
swiss-finance-dashboard = "personal_finance.dashboard:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.4.0",
    "ruff>=0.15.0",
]
# Browser end-to-end tests (tests/e2e). Not installed by default:
#   uv sync --group e2e && uv run playwright install chromium
e2e = [
    "playwright>=1.60",
]

# --- Packaging (src layout) ---------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_finance = ["py.typed", "dashboard/assets/*.css"]

# --- Tooling ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = ["e2e: end-to-end tests in a real browser (need the e2e dependency group)"]

[tool.coverage.run]
# A path (not the package name) so that code run via ``python -m`` is measured too.
source = ["src/personal_finance"]
branch = true
# Only the application code counts; tests are not measured (also in the VS Code view).
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["personal_finance"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
