[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-personal-finance"
version = "0.1.0"
description = "Swiss personal finance planning tool with 2. Säule and 3a calculations"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Finance Tools", email = "admin@example.com"}
]
license = "MIT"
keywords = ["finance", "swiss", "retirement", "dashboard", "pillar2", "pillar3a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "dash>=2.14.0",
    "plotly>=5.17.0",
]

[project.scripts]
swiss-finance-dashboard = "personal_finance.dashboard:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.4.0",
    "ruff>=0.15.0",
]

# --- Packaging (src layout) ---------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_finance = ["py.typed", "dashboard/assets/*.css"]

# --- Tooling ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.coverage.run]
source = ["personal_finance"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["personal_finance"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
