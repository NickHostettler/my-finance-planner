name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux = the production platform (also runs the real gunicorn test).
        # Windows = the development machine.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Python version comes from .python-version; --locked fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -rs

  e2e:
    name: Browser test (user isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group e2e

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: End-to-end tests
        run: uv run pytest tests/e2e -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Enabled automatically once a Dockerfile exists (issue #7).
      - name: Check for Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Dockerfile yet - skipping."; fi

      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.present == 'true'

      - name: Build image
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: my-finance-planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and check /health
        if: steps.dockerfile.outputs.present == 'true'
        shell: bash
        run: |
          docker run -d --name app -p 8050:8050 -e PORT=8050 my-finance-planner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8050/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8050/health
          curl -fsS http://127.0.0.1:8050/ | grep -q "Finanzplan"
          docker image ls my-finance-planner:ci --format 'Image size: {{.Size}}'

      - name: Container logs
        if: always() && steps.dockerfile.outputs.present == 'true'
        run: docker logs app || true
