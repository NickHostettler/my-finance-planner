name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux = the production platform (also runs the real gunicorn test).
        # Windows = the development machine.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only (no floating "v10").
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Python version comes from .python-version; --locked fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -rs

  e2e:
    name: Browser test (user isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only (no floating "v10").
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group e2e

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          E2E_REQUIRED: "1"  # a missing browser fails instead of skipping
        run: uv run pytest tests/e2e -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Enabled automatically once a Dockerfile exists (issue #7).
      - name: Check for Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Dockerfile yet - skipping."; fi

      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.present == 'true'

      - name: Build image
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: my-finance-planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container refuses to start without a password
        if: steps.dockerfile.outputs.present == 'true'
        shell: bash
        run: |
          if timeout 60 docker run --rm my-finance-planner:ci > nopw.log 2>&1; then
            cat nopw.log; echo "::error::container started without APP_PASSWORD"; exit 1
          fi
          grep -q "refusing to start" nopw.log && echo "OK: refused to start without APP_PASSWORD"

      - name: Start container and check /health
        if: steps.dockerfile.outputs.present == 'true'
        shell: bash
        env:
          APP_PASSWORD: ci-only-test-password-123
        run: |
          # Read-only root filesystem: proves the app writes no data to disk.
          # A non-default PORT checks that the platform's $PORT is honoured.
          docker run -d --name app --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            -p 8050:10000 -e PORT=10000 -e APP_PASSWORD my-finance-planner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8050/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8050/health
          # Login required everywhere except /health and /robots.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8050/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u kamerad:wrong-password-xyz http://127.0.0.1:8050/)" = "401"
          curl -fsS http://127.0.0.1:8050/robots.txt | grep -q "Disallow: /"
          curl -fsS -u "kamerad:$APP_PASSWORD" http://127.0.0.1:8050/ | grep -q "Finanzplan"
          curl -fsS -u "kamerad:$APP_PASSWORD" http://127.0.0.1:8050/assets/dashboard.css > /dev/null
          echo "OK: 401 without/with wrong login, 200 with login, /health public"
          echo "Container user id: $(docker exec app id -u)"
          test "$(docker exec app id -u)" != "0"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "Docker HEALTHCHECK: $status"
          test "$status" = "healthy"
          docker image ls my-finance-planner:ci --format 'Image size: {{.Size}}'

      - name: Image size breakdown
        if: steps.dockerfile.outputs.present == 'true'
        shell: bash
        run: |
          docker history my-finance-planner:ci --format '{{.Size}}\t{{.CreatedBy}}' | cut -c1-120 | head -15
          docker exec app sh -c 'du -sh /app/.venv; du -s /app/.venv/lib/python*/site-packages/* | sort -rn | head -10'
          docker exec app sh -c 'echo "pyc: $(find /app/.venv -name "*.pyc" -print0 | du -ch --files0-from=- | tail -1)"'

      - name: No errors in container logs
        if: steps.dockerfile.outputs.present == 'true'
        shell: bash
        run: |
          if docker logs app 2>&1 | grep -E "\[(ERROR|CRITICAL)\]|Traceback"; then
            echo "::error::gunicorn logged errors"; exit 1
          fi

      - name: Container logs
        if: always() && steps.dockerfile.outputs.present == 'true'
        run: docker logs app || true
